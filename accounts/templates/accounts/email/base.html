<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ email_title }}</title>
</head>
<body style="margin:0;background:#f3f5f7;color:#17202a;font-family:Arial,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(23,32,42,.08);">
          <tr>
            <td style="background:#17202a;color:#ffffff;padding:22px 28px;font-size:20px;font-weight:700;">
              Origo
              <span style="float:right;color:#b8c4ce;font-size:13px;font-weight:400;">{{ app_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #e8ecef;padding:18px 28px;color:#68737d;font-size:12px;line-height:1.5;">
              Det här är ett automatiskt meddelande från Origo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
